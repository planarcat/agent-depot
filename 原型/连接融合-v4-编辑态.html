<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 连接融合 v4 —— 随时可编辑 · 三区布局</title>
<style>
:root {
  --c-ink: #171d1f; --c-ink-2: #3c4447; --c-ink-3: #5b6669; --c-ink-4: #8a9497;
  --c-bg: #f2f4f4; --c-surface: #f9fafa; --c-surface-2: #ffffff;
  --c-line: #d9dedf; --c-line-soft: #e6eaeb; --c-rail: #f4f3f0;
  --c-accent: #0d6a63; --c-accent-strong: #0a544e; --c-accent-soft: #eaf2f1;
  --c-accent-line: #bfd6d2; --c-on-accent: #ffffff;
  --c-err: #a03d2e; --c-err-soft: #f8ece9; --c-err-line: #f0c8bf;
  --c-ok: #1a7f4b; --c-ok-soft: #e8f4ee; --c-warn: #8a6d1f; --c-warn-soft: #f6f1e2;
  --c-t-agents: #4a7d8c; --c-t-claude: #d97757; --c-t-pi: #6f8a4f;
  --c-t-wb: #4a7d8c; --c-t-zcode: #9a6b3f; --c-t-codex: #2f6f6f;
  --fs-xs: 10px; --fs-s: 11px; --fs-md: 12px; --fs-body: 13px; --fs-m: 14px;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --tcard: 136px; --r-xs: 6px; --r-s: 4px; --r-m: 8px; --r-l: 12px;
  --t-quick: 150ms cubic-bezier(.2,.6,.3,1); --t-base: 250ms cubic-bezier(.2,.6,.3,1);
  --sh-hover: 0 4px 12px rgba(23,29,31,.08), 0 1px 2px rgba(23,29,31,.04);
  --sh-float: 0 8px 24px rgba(23,29,31,.14);
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--c-bg); color: var(--c-ink); font-family: var(--font-sans);
  font-size: var(--fs-body); padding: var(--sp-4); }
button { font-family: var(--font-sans); }
.topbar { display: flex; align-items: center; gap: var(--sp-4); background: var(--c-surface-2);
  border: 1px solid var(--c-line); border-radius: var(--r-l); padding: var(--sp-2) var(--sp-4); }
.topbar nav { display: flex; gap: var(--sp-3); color: var(--c-ink-3); }
.topbar nav .on { color: var(--c-accent); font-weight: 600; }
.topbar .engine { margin-left: auto; font-size: var(--fs-s); color: var(--c-ok); }
.btn { border: 1px solid var(--c-line); background: var(--c-surface-2); color: var(--c-ink);
  border-radius: var(--r-xs); font-size: var(--fs-s); padding: 4px 10px; cursor: pointer;
  transition: background var(--t-quick); }
.btn:hover { background: var(--c-surface); }
.btn.primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-on-accent); }
.btn.primary:hover { background: var(--c-accent-strong); }
.btn.danger { color: var(--c-err); border-color: var(--c-err-line); background: var(--c-err-soft); }
.btn.sm { padding: 3px 9px; }
.grid { display: flex; gap: var(--sp-3); flex-wrap: nowrap; }  /* 卡片不换行 */

/* ==== 三区主布局：左列（目录区 + 工具区） / 右列（条目区，默认隐藏） ==== */
.main { display: flex; gap: var(--sp-3); align-items: flex-start; }
.maincol { flex: 1; min-width: 0; }

/* ==== 目录区（上方源卡） ==== */
.srcrow { display: flex; gap: var(--sp-3); align-items: flex-start; margin-top: var(--sp-3); flex-wrap: nowrap; }
.group { flex: 0 1 auto; min-width: 128px; border: 1px solid var(--c-line); border-radius: var(--r-m); background: var(--c-surface);
  padding: var(--sp-2); width: 170px; flex: none; display: flex; flex-direction: column; }
.group .nm { font-weight: 600; }
.group .meta { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--c-ink-4);
  margin: var(--sp-1) 0; }
.group .d { font-size: var(--fs-s); color: var(--c-ink-4); line-height: 1.5; }
.group .acts { margin-top: auto; padding-top: var(--sp-2); display: flex; flex-direction: column;
  gap: var(--sp-1); }
.tcard { width: 150px; min-width: 96px; flex: 0 1 auto; aspect-ratio: 1 / 1; border: 1px solid var(--c-line);
  border-radius: var(--r-m); background: var(--c-surface-2); position: relative;
  cursor: pointer; padding: var(--sp-2) var(--sp-2) 20px;
  transition: transform var(--t-quick), box-shadow var(--t-quick); }
.tcard:hover { transform: translateY(-2px); box-shadow: var(--sh-hover); z-index: 5; }
.tcard.is-focus { box-shadow: 0 0 0 2px var(--c-accent); }
.tcard.is-dim { opacity: .38; }
.tcard.is-dim:hover { opacity: 1; }  /* 同类降对比后悬停仍可高亮 */
.cnt { position: absolute; top: var(--sp-2); left: var(--sp-2); display: inline-flex;
  min-width: 28px; height: 28px; border-radius: var(--r-xs);
  border: 1px solid var(--c-line); background: var(--c-surface); padding: 0 6px;
  align-items: center; justify-content: center; font-family: var(--font-mono);
  font-size: var(--fs-md); font-weight: 600; color: var(--c-accent); }
.cnt.ink { color: var(--c-ink-2); }
.chip { width: 48px; height: 48px; border-radius: 12px; margin: 30px auto 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: var(--fs-m); font-weight: 600; }
.ch-dir { background: #3c4447; } .ch-repo { background: #5b6669; }
.ch-codex { background: var(--c-t-codex); } .ch-agents { background: var(--c-t-agents); }
.ch-claude { background: var(--c-t-claude); } .ch-pi { background: var(--c-t-pi); }
.ch-wb { background: var(--c-t-wb); } .ch-zcode { background: var(--c-t-zcode); }
.tnm { font-size: var(--fs-body); font-weight: 600; text-align: center; margin-top: var(--sp-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard__tag { position: absolute; left: var(--sp-2); bottom: 4px;
  display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap;
  font-size: var(--fs-s); font-weight: 600; color: var(--c-ink-4); }
.tcard__tag .arr { color: var(--c-ink-4); }
.tpath { position: absolute; right: var(--sp-2); bottom: 5px;
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-ink-4);
  max-width: 58px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metastrip { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-3);
  font-size: var(--fs-s); color: var(--c-ink-3); flex-wrap: wrap; }
.metastrip > span { display: inline-flex; align-items: center; gap: 6px; }
.metastrip b { font-size: 16px; margin-right: 4px; }
.metastrip .rule { color: var(--c-ink-4); margin-left: auto; }

/* ==== 连接状态点：绿实心=完整跟随 / 绿虚线=部分跟随 / 灰=未连接 ==== */
.tool-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot--agents { --c: var(--c-t-agents); } .dot--claude { --c: var(--c-t-claude); }
.dot--pi { --c: var(--c-t-pi); } .dot--wb { --c: var(--c-t-wb); }
.dot--zcode { --c: var(--c-t-zcode); } .dot--codex { --c: var(--c-t-codex); }
.tool-dot { background: var(--c); }
.bdot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.bdot.full { background: var(--c-ok); }
.bdot.part { background: var(--c-ok-soft); border: 2px dashed var(--c-ok); }
.bdot.off { background: var(--c-line); }
.legend { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-3);
  font-size: var(--fs-s); color: var(--c-ink-3); flex-wrap: wrap; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend .rule { color: var(--c-ink-4); margin-left: auto; }

/* ==== 类型区（Skills / MCP 正方形卡，样式同目录/工具卡） ==== */
.typerow { display: flex; gap: var(--sp-3); margin-top: var(--sp-3); align-items: flex-start; }
.typecard { cursor: pointer; }
.typecard.is-off { opacity: .4; }
.ch-skills { background: var(--c-accent); }
.ch-mcp { background: #5b6669; }

/* ==== 三行看板：目录行 → 连线带 → Skills/MCP 行（居中） → 连线带 → 工具行（贴底），行间只有连线 ==== */
.linkzone { position: relative; margin-top: var(--sp-3);
  display: flex; flex-direction: column;
  height: calc(100vh - 132px); min-height: 500px; }
.linkzone .srcrow, .linkzone .typerow, .linkzone .toolsrow { position: relative; z-index: 2; }
.linkzone .srcrow { margin-top: 0; overflow-x: auto; }  /* 窄窗口横向滚动，不换行 */
.linkzone .gap { flex: 1; min-height: 64px; }
.linkzone .gap.g1 { flex: .55; }  /* 目录与 Skills/MCP 贴近 */
.linkzone .typerow { justify-content: center; }
.linkzone .toolsrow { margin-top: 0; overflow-x: auto; }
.linksvg { position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1; }
.linksvg g.line-g path.vis { fill: none; stroke: var(--c-ok); stroke-width: 2.5;
  opacity: .55; transition: stroke-width var(--t-quick), opacity var(--t-quick); }
.linksvg g.line-g path.vis.part { stroke-dasharray: 8 5; }
.linksvg g.line-g path.vis.blocked { stroke: var(--c-ink-4); stroke-dasharray: 3 4; opacity: .4; }
.linksvg g.line-g path.vis.offln { stroke: var(--c-ink-4); stroke-dasharray: 2 5; opacity: .45; }  /* 无链接态：点击建立连接 */
.linksvg g.line-g:hover path.vis { stroke-width: 4.5; opacity: .85; }
/* 删除后按钮变成“链接”按钮（同样只留符号，平时低调） */
.del-btn.link { font-size: 19px; }
.del-btn.link:hover { background: none; color: var(--c-accent); }
/* 删除按钮层（覆盖在画布上，仅灰线时出现在连线与工具的交界处） */
.dellayer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
/* 平时只是一个低调的 ×（无边框无底色），悬停才高亮 */
.del-btn { position: absolute; pointer-events: auto; width: 28px; height: 28px;
  border: 0; background: none; color: var(--c-ink-4);
  opacity: .5; font-size: 20px; line-height: 1; cursor: pointer; display: flex; align-items: center;
  justify-content: center; padding: 0; text-shadow: 0 1px 2px rgba(255,255,255,.9);
  transition: opacity var(--t-quick), color var(--t-quick), transform var(--t-quick); }
.del-btn:hover { opacity: 1; transform: scale(1.2); background: none; color: var(--c-err); }
/* 待确认状态：有未生效的连接改动时，右下角出现「撤销 / 确认」 */
.apply-bar { position: fixed; right: var(--sp-5); bottom: var(--sp-5); z-index: 20; display: none;
  gap: var(--sp-3); align-items: center; padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
  background: var(--c-surface-2); border: 1px solid var(--c-line); border-radius: 999px;
  box-shadow: var(--sh-float); }
.apply-bar .tip { font-size: var(--fs-s); color: var(--c-ink-3); white-space: nowrap; }
.apply-bar .tip b { color: var(--c-warn); font-weight: 600; }
.apply-bar.is-on { display: inline-flex; animation: applyin var(--t-base); }
@keyframes applyin { from { opacity: 0; transform: translateY(6px); } }
.apply-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
  border-radius: 999px; cursor: pointer; font-size: var(--fs-body); font-weight: 600;
  box-shadow: var(--sh-float); transition: background var(--t-quick), transform var(--t-quick); }
.apply-btn.primary { background: var(--c-accent); border: 1px solid var(--c-accent); color: var(--c-on-accent); }
.apply-btn.primary:hover { background: var(--c-accent-strong); transform: translateY(-1px); }
.apply-btn.ghost { background: var(--c-surface-2); border: 1px solid var(--c-line); color: var(--c-ink-2); }
.apply-btn.ghost:hover { background: var(--c-surface); transform: translateY(-1px); }
.linksvg path.hit { fill: none; stroke: transparent; stroke-width: 16;
  pointer-events: stroke; cursor: pointer; }

/* ==== 工具区（下方，样式同目录卡） ==== */
.toolsrow { margin-top: var(--sp-4); }
.toolsrow .rl { font-size: var(--fs-s); font-weight: 600; color: var(--c-ink-3); margin-bottom: var(--sp-2); }

/* ==== 条目区（右侧，默认隐藏） ==== */
.ipanel { width: 360px; flex: none; border: 1px solid var(--c-accent-line);
  border-radius: var(--r-l); background: var(--c-surface-2); overflow: hidden;
  display: none; flex-direction: column; position: sticky; top: var(--sp-2);
  height: fit-content; max-height: calc(100vh - 132px); }
.ipanel.is-in { display: flex; animation: slidein var(--t-base); }
@keyframes slidein { from { opacity: 0; transform: translateX(12px); } }
.iph { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--c-line); background: var(--c-surface); }
.iph b { font-size: var(--fs-body); min-width: 0; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.iph .ops { margin-left: auto; display: flex; gap: var(--sp-1); }
.iph .x { border: 0; background: none; color: var(--c-ink-4); font-size: var(--fs-m);
  cursor: pointer; padding: 2px 4px; }
.pstat { display: flex; align-items: flex-start; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--c-line-soft); }
.pstat .txt { font-size: var(--fs-s); color: var(--c-ink-3); line-height: 1.6; }
.pill { padding: 3px 10px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; flex: none; }
.pill.ok { background: var(--c-ok-soft); color: var(--c-ok); }
.pill.part { background: var(--c-warn-soft); color: var(--c-warn); }
.pill.off { background: var(--c-rail); color: var(--c-ink-4); }
.ipitems { flex: 0 1 auto; overflow-y: auto; padding: var(--sp-2) var(--sp-3); }
.c-group { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-1) 0; }
.c-group .lab { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; color: var(--c-ink-3); }
.c-group .rule { flex: 1; height: 1px; background: var(--c-line); }
.c-group .n { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-ink-4); }
.c-flow { display: flex; flex-direction: column; gap: 7px; }
/* 条目 = 名称胶囊（左）+ 裸工具指示器（右，按列对齐） */
.c-item { display: grid; grid-template-columns: minmax(0, 1fr) auto;
  align-items: center; gap: 12px; cursor: pointer; }
.c-name { display: inline-flex; align-items: center; justify-content: flex-start;
  width: 100%; min-width: 0; border: 1px solid var(--c-line-soft);
  background: var(--c-surface); border-radius: 999px; padding: 6px 12px;
  font-size: var(--fs-body); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: border-color var(--t-quick), background var(--t-quick), opacity var(--t-quick); }
.c-item:hover .c-name { border-color: var(--c-accent-line); background: var(--c-accent-soft); }
.c-name.on { border-color: var(--c-accent); background: var(--c-accent-soft); }
.c-name.off { opacity: .45; }
.c-item .dots { display: grid; grid-template-columns: repeat(6, 22px); justify-items: center;
  align-items: center; gap: 2px; flex: none; }
/* 指示器裸奔：只有色点，无底框无边框 */
.tmini { width: 14px; height: 14px; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; cursor: pointer;
  transition: opacity var(--t-quick), outline-color var(--t-quick); background: none; border: 0; }
/* 默认：实心色点（未跟随淡化，跟随中全亮） */
.tmini .tool-dot { width: 10px; height: 10px; background: var(--c); opacity: .32;
  transition: background var(--t-quick), box-shadow var(--t-quick), opacity var(--t-quick); }
.tmini.on .tool-dot { background: var(--c); box-shadow: none; opacity: 1; }
/* 圆点始终实心：选中工具列的未连接点略微提亮，配合呼吸环提示 */
.ipanel.is-pair .tmini.sel:not(.on) .tool-dot { opacity: .55; }
/* 当前编辑工具：呼吸光圈（提示“这一列正在编辑中”） */
.tmini { position: relative; z-index: 0; }
.tmini.sel { outline: none; opacity: 1; }
/* 已连接：实心点 + 实心圆环（静止）；
   未连接且在当前编辑工具列：空心点 + 呼吸圆环（提示可点击连接） */
.ipanel.is-pair .tmini.sel:not(.on)::after {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  border: 2px solid var(--c); pointer-events: none; z-index: -1;
  animation: breathe 2.2s ease-in-out infinite;
}
.ipanel.is-pair .tmini.sel.on::after {
  content: ''; position: absolute; inset: -3px; border-radius: 50%;
  border: 3px solid var(--c); pointer-events: none; z-index: -1;
  animation: none; opacity: 1;
}
@keyframes breathe {
  0%, 100% { transform: scale(.9);  opacity: .75; }
  50%      { transform: scale(1.14); opacity: .2; }
}
@media (prefers-reduced-motion: reduce) {
  .ipanel.is-pair .tmini.sel:not(.on)::after { animation: none; opacity: .5; }
}
.restline { font-size: var(--fs-xs); color: var(--c-ink-4); padding: var(--sp-1) 0; }
.hint { color: var(--c-ink-4); font-size: var(--fs-body); line-height: 1.6; }
.brow { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-2);
  border: 1px solid var(--c-line-soft); border-radius: var(--r-xs); margin-bottom: var(--sp-1); }
.brow .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .st { font-size: var(--fs-xs); flex: none; }
.brow .st.ok { color: var(--c-ok); } .brow .st.part { color: var(--c-warn); }
.ipfoot { padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--c-line);
  display: flex; gap: var(--sp-2); background: var(--c-surface); }
.ipfoot:empty { display: none; }
</style>
</head>
<body>
<div class="topbar">
  <b style="font-size:var(--fs-m)">Agent Depot</b>
  <nav><span>会话</span><span>记忆</span><span class="on">Skills / MCP</span><span>台账</span><span>统计</span><span>设置</span></nav>
  <span class="engine">引擎 casr · 已连接</span>
</div>

<div class="main">
  <div class="maincol">

    <div class="metastrip">
      <span><b>61</b>条目 · 全部来源</span><span class="muted"><b>52</b>本地</span>
      <span><b>10</b>远程拉取</span><span><b>88</b>已部署到工具</span>
      <span class="sep"></span>
      <span><i class="bdot full"></i>完整跟随</span>
      <span><i class="bdot part"></i>部分跟随（有排除条目）</span>
      <span><i class="bdot off"></i>未连接</span>
      <span class="rule">随时可编辑 · 选中目录后展示其链接态 · 类型卡聚焦可多选、工具卡单选，聚焦时仅显示选中者的连线</span>
    </div>

    <!-- 三行看板：目录行 → 连线带 → Skills/MCP 行（居中） → 连线带 → 工具行（贴底），行间只有连线 -->
    <div class="linkzone" id="linkzone">
      <div class="srcrow">
        <div class="group">
          <div class="nm">本地</div>
          <div class="meta">3 源 · 52 条</div>
          <div class="d">默认目录 + 已链接目录</div>
          <div class="acts"><button class="btn">目录管理</button><button class="btn">新建</button><button class="btn">导入</button></div>
        </div>
        <div class="grid" id="dircards"></div>
        <div class="group">
          <div class="nm">远程仓库</div>
          <div class="meta">1 源 · 9 条</div>
          <div class="acts"><button class="btn">添加仓库</button><button class="btn">全部拉取</button></div>
        </div>
        <div class="grid" id="repocards"></div>
      </div>
      <div class="gap g1"></div>
      <div class="typerow">
        <div class="tcard typecard" id="type-skills" data-type="skills" title="点击聚焦 / 再点取消（可多选）"></div>
        <div class="tcard typecard" id="type-mcp" data-type="mcp" title="点击聚焦 / 再点取消（可多选）"></div>
      </div>
      <div class="gap"></div>
      <div class="toolsrow">
        <div class="grid" id="toolcards"></div>
      </div>
      <svg class="linksvg" id="linksvg"></svg>
    </div>

  </div>

  <!-- 条目区（右侧，默认隐藏，点卡出现） -->
  <div class="ipanel" id="ipanel">
    <div class="iph">
      <b id="ip-title">条目</b>
      <span class="ops">
        <button class="btn sm" id="ip-all">全选</button>
        <button class="btn sm" id="ip-none">全不选</button>
      </span>
      <button class="x" id="ip-x" title="收起">✕</button>
    </div>
    <div class="pstat" id="ip-stat"></div>
    <div class="ipitems" id="ip-items"></div>
    <div class="ipfoot" id="ip-foot"></div>
  </div>
</div>

<script>
/* ==== 数据（示例口径：n=条目总数，s/m=skills/mcp 数；列表仅列样例，其余以「+N 条…」示意） ==== */
const DIRS = [
  { id: 'd-def', name: '默认目录', n: 16, s: 16, m: 0, chip: '默认', cls: 'ch-dir',
    skills: ['scratch-note'], mcp: [] },
  { id: 'd-ag', name: 'agent-skills', n: 17, s: 15, m: 2, chip: 'AG', cls: 'ch-dir',
    skills: ['agent-html-skills', 'api-snapshot', 'capturing-takeaways', 'change-advice',
      'design-guardrails', 'development-guardrails', 'full-code-review', 'generate-commit'],
    mcp: ['api-mcp', 'docs-mcp'] },
  { id: 'd-li', name: 'lingchuang-skills', n: 11, s: 10, m: 1, chip: 'LI', cls: 'ch-dir',
    skills: ['界面审查', '日报撰写'], mcp: ['kb-mcp'] },
];
const REPOS = [
  { id: 'r-ve', name: 'Vercel Skills', n: 9, s: 9, m: 0, chip: 'VE', cls: 'ch-repo',
    skills: ['vercel-deploy'], mcp: [] },
];
const TOOLS = [
  { id: 'codex', name: 'Codex CLI', dot: 'dot--codex', ch: 'ch-codex', path: '~/.agents/skills' },
  { id: 'agents', name: 'Agents', dot: 'dot--agents', ch: 'ch-agents', path: '~/.agents/skills' },
  { id: 'claude', name: 'Claude Code', dot: 'dot--claude', ch: 'ch-claude', path: '~/.claude/skills' },
  { id: 'pi', name: 'Pi-Agent', dot: 'dot--pi', ch: 'ch-pi', path: '~/.pi/agent/skills' },
  { id: 'workbuddy', name: 'WorkBuddy', dot: 'dot--wb', ch: 'ch-wb', path: '~/.workbuddy/skills' },
  { id: 'zcode', name: 'ZCode', dot: 'dot--zcode', ch: 'ch-zcode', path: '~/.zcode/skills' },
];

/* 绑定 = { dir, tool, types:{skills,mcp}, excluded:[不跟随的条目] }
   types 按类型独立开关：两条通道各自连接/断开，互不影响 */
const DEF_TYPES = () => ({ skills: true, mcp: true });
const typesOf = b => b.types || DEF_TYPES();
let BINDS = [
  { dir: 'd-ag', tool: 'pi', types: DEF_TYPES(), excluded: ['design-guardrails', 'change-advice'] },
  { dir: 'd-li', tool: 'claude', types: DEF_TYPES(), excluded: [] },
];
let REPO_BINDS = [
  { dir: 'r-ve', tool: 'codex', types: DEF_TYPES(), excluded: [] },
];

let selDir = null, selTool = null;
/* 已标记删除的通道：key = dir:type:tool。灰线=仅断开（工具内条目保留），红色=将清理该目录传过去的条目 */
const PURGE = new Set();
/* 已生效快照：连接改动先落在工作态，点“确认更改”才写入快照（= 生效） */
let COMMITTED = null;
const stateSig = () => JSON.stringify({ b: BINDS, r: REPO_BINDS, p: [...PURGE].sort() });
const isDirty = () => COMMITTED !== null && stateSig() !== COMMITTED;
const purgeKey = (ty, toolId) => `${selDir}:${ty}:${toolId}`;
const typeOn = { skills: true, mcp: true };  /* 类型卡多选：默认两者都选中 */
const anyTypeOn = () => typeOn.skills || typeOn.mcp;
const allBinds = () => [...BINDS, ...REPO_BINDS];
const T = id => TOOLS.find(t => t.id === id) || { id, name: id, dot: '', ch: 'ch-repo', path: '' };
const D = id => DIRS.concat(REPOS).find(d => d.id === id);
const itemsOfDir = d => [...(d.skills || []), ...(d.mcp || [])];
const bindingOf = (dirId, toolId) => allBinds().find(b => b.dir === dirId && b.tool === toolId);
const stateOf = b => !b ? 'off' : (!typesOf(b).skills && !typesOf(b).mcp ? 'off' : (b.excluded.length ? 'part' : 'full'));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function removeBind(dir, tool) {
  let i = BINDS.findIndex(b => b.dir === dir && b.tool === tool);
  if (i >= 0) BINDS.splice(i, 1);
  i = REPO_BINDS.findIndex(b => b.dir === dir && b.tool === tool);
  if (i >= 0) REPO_BINDS.splice(i, 1);
}
function toast(m) {
  const t = document.getElementById('toast') || (() => {
    const d = document.createElement('div'); d.id = 'toast';
    d.style.cssText = 'position:fixed;right:24px;bottom:92px;z-index:99;background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:var(--r-m);box-shadow:var(--sh-float);padding:8px 12px;font-size:var(--fs-s);max-width:420px';
    document.body.appendChild(d); return d;
  })();
  t.textContent = m; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2800);
}
function toggleBindItem(b, name) {
  if (b.excluded.includes(name)) {
    b.excluded = b.excluded.filter(n => n !== name);
    /* 恢复条目意味着这一类要跟随：把对应通道打开 */
    const d0 = D(b.dir), ty = d0.skills.includes(name) ? 'skills' : 'mcp';
    b.types = b.types || { skills: true, mcp: true };
    b.types[ty] = true;
  }
  else b.excluded.push(name);
  const d0 = D(b.dir);
  const items = itemsOfDir(d0);
  /* 全部排除 = 断开：整目录排空 → 移除绑定；某一类排空 → 关掉该通道（不留“空连接”） */
  if (b.excluded.length >= items.length) {
    removeBind(b.dir, b.tool);
    toast('全部条目已排除，连接已移除（工具内已安装文件保留）');
    renderAll();
    return;
  }
  b.types = b.types || { skills: true, mcp: true };
  const tyName = d0.skills.includes(name) ? 'skills' : 'mcp';
  const tyItems = tyName === 'skills' ? (d0.skills || []) : (d0.mcp || []);
  if (tyItems.length && tyItems.every(n => b.excluded.includes(n))) {
    b.types[tyName] = false;
    if (!b.types.skills && !b.types.mcp) removeBind(b.dir, b.tool);
    toast(`「${name}」已停止跟随；该类已全部排除，通道关闭`);
  } else {
    toast(b.excluded.includes(name)
      ? `「${name}」已停止跟随 ${T(b.tool).name}（工具内保留）`
      : `「${name}」已恢复跟随 ${T(b.tool).name}`);
  }
  renderAll();
}

/* ==== 渲染：目录区 ==== */
function renderSrc() {
  document.getElementById('dircards').innerHTML = DIRS.map(d => {
    const bs = allBinds().filter(b => b.dir === d.id);
    const dots = bs.map(b => `<span class="bdot ${stateOf(b)}" title="${esc(T(b.tool).name)}"></span>`).join('');
    const cls = selDir === d.id ? 'is-focus' : selDir ? 'is-dim' : '';
    return `<div class="tcard ${cls}" data-dir="${d.id}" title="${esc(d.name)} · ${d.n} 条">
      <span class="cnt">${d.n}</span>
      <div class="chip ${d.cls}">${esc(d.chip)}</div>
      <div class="tnm">${esc(d.name)}</div>
      ${dots ? `<span class="tcard__tag"><span class="arr">→</span>${dots}</span>` : ''}
    </div>`;
  }).join('');
  document.getElementById('repocards').innerHTML = REPOS.map(r => {
    const bs = allBinds().filter(b => b.dir === r.id);
    const dots = bs.map(b => `<span class="bdot ${stateOf(b)}" title="${esc(T(b.tool).name)}"></span>`).join('');
    const cls = selDir === r.id ? 'is-focus' : selDir ? 'is-dim' : '';
    return `<div class="tcard ${cls}" data-repo="${r.id}" title="${esc(r.name)} · ${r.n} 条">
      <span class="cnt ink">${r.n}</span>
      <div class="chip ${r.cls}">${esc(r.chip)}</div>
      <div class="tnm">${esc(r.name)}</div>
      ${dots ? `<span class="tcard__tag"><span class="arr">⇐</span>${dots}</span>` : ''}
    </div>`;
  }).join('');
}

/* ==== 渲染：工具区（样式同目录卡） ==== */
function renderTools() {
  document.getElementById('toolcards').innerHTML = TOOLS.map(t => {
    const bs = allBinds().filter(b => b.tool === t.id);
    const n = bs.reduce((s, b) => s + (D(b.dir).n - b.excluded.length), 0);
    const dots = bs.map(b => `<span class="bdot ${stateOf(b)}" title="${esc(D(b.dir).name)}"></span>`).join('');
    /* 选中工具 → 该工具选中态，其他工具降对比 */
    const cls = selTool === t.id ? 'is-focus' : selTool ? 'is-dim' : '';
    return `<div class="tcard ${cls}" data-tool="${t.id}" title="${esc(t.name)} · ${esc(t.path)} · ${n} 条已装">
      <span class="cnt ink">${n}</span>
      <div class="chip ${t.ch}">${esc(t.name.slice(0, 2).toUpperCase())}</div>
      <div class="tnm">${esc(t.name)}</div>
      ${dots ? `<span class="tcard__tag"><span class="arr">⇐</span>${dots}</span>` : ''}
      <span class="tpath">${esc(t.path)}</span>
    </div>`;
  }).join('');
}

/* ==== 渲染：类型区（Skills / MCP 中间层） ==== */
/* 某目录某类条目对某工具的跟随态：full/part/blocked（该类全被排除但通道仍开）/off（通道关闭或无绑定）
   空类型（该目录没有此类条目）只要通道开着就算 full —— 通道是“连/不连”，与条目数无关 */
function typeState(dirId, toolId, type) {
  const d = D(dirId), b = bindingOf(dirId, toolId);
  if (!b || !typesOf(b)[type]) return 'off';
  const items = type === 'skills' ? (d.skills || []) : (d.mcp || []);
  if (!items.length) return 'full';
  const ex = items.filter(n => b.excluded.includes(n)).length;
  if (ex >= items.length) return 'off';  /* 全部排除 = 等同未连接（不留“空连接”） */
  return ex ? 'part' : 'full';
}
/* 每工具某类型的跟随态：选中目录 = 该目录视角；未选 = 全部来源聚合（full > part > blocked） */
function typeToolState(toolId, ty) {
  if (selDir) return typeState(selDir, toolId, ty);
  let st = 'off';
  allBinds().forEach(b => {
    const s = typeState(b.dir, toolId, ty);
    if (s === 'full') st = 'full';
    else if (s === 'part' && st !== 'full') st = 'part';
    else if (s === 'blocked' && st === 'off') st = 'blocked';
  });
  return st;
}
function renderTypes() {
  const d = selDir ? D(selDir) : null;
  [['skills', 'type-skills', 'SK'], ['mcp', 'type-mcp', 'MC']].forEach(([ty, elId, tag]) => {
    const el = document.getElementById(elId);
    const cnt = d ? (ty === 'skills' ? d.s : d.m)
      : DIRS.concat(REPOS).reduce((s, x) => s + (ty === 'skills' ? x.s : x.m), 0);
    const dots = TOOLS.map(t => ({ t, st: typeToolState(t.id, ty) }))
      .filter(x => x.st !== 'off')
      .map(x => `<span class="bdot ${x.st === 'blocked' ? 'off' : x.st}" title="${esc(x.t.name)} · ${x.st === 'part' ? '部分跟随' : x.st === 'blocked' ? '该类已全部排除' : '完整跟随'}"></span>`)
      .join('');
    /* 选中态属于「已选目录」的上下文：没选目录时两张卡都是普通态 */
    const ctx = !!selDir;
    el.classList.toggle('is-focus', ctx && typeOn[ty]);
    el.classList.toggle('is-dim', ctx && anyTypeOn() && !typeOn[ty]);
    el.innerHTML = `
      <span class="cnt">${cnt}</span>
      <div class="chip ${ty === 'skills' ? 'ch-skills' : 'ch-mcp'}">${tag}</div>
      <div class="tnm">${ty === 'skills' ? 'Skills' : 'MCP'}</div>
      ${dots ? `<span class="tcard__tag"><span class="arr">→</span>${dots}</span>` : ''}
      <span class="tpath">${d ? esc(d.name) : '全部来源'}</span>`;
  });
}

/* ==== 渲染：条目区（右侧） ==== */
/* 方案 C · 标签流：分组头 + 胶囊条目（SKILLS/MCP 各一组） */
const chipFlow = (d, mkChip) => {
  let h = '';
  const sk = d.skills || [], mc = d.mcp || [];
  const group = (ty, label, items, count) => {
    if (!typeOn[ty]) return '';  /* 类型卡未选中 → 该组不显示（与画布过滤同口径） */
    const head = `<div class="c-group"><span class="lab">${label}</span><span class="rule"></span><span class="n">${count}</span></div>`;
    /* 该类型没有条目也保留分组，明确告诉用户这一侧是空的 */
    return head + (items.length
      ? `<div class="c-flow">${items.map(mkChip).join('')}</div>`
      : `<div class="restline">此目录没有 ${label} 条目</div>`);
  };
  h += group('skills', 'SKILLS', sk, d.s);
  h += group('mcp', 'MCP', mc, d.m);
  if (!h) h = '<div class="restline">两类都已关闭 —— 点上方 Skills / MCP 卡片可重新开启</div>';
  return h;
};
/* 统一胶囊：名称 + 6 个工具圆点（两种模式同一结构，仅跟随态与强调点不同） */
const chip = name => {
  const dots = TOOLS.map(t => {
    const b = bindingOf(selDir, t.id);
    const on = b && !b.excluded.includes(name);
    const isSel = selTool === t.id;
    return `<span class="tmini ${t.dot} ${on ? 'on' : ''}${isSel ? ' sel' : ''}"` +
      ` data-tg="${t.id}" data-item="${esc(name)}"` +
      ` title="${esc(t.name)}：${on ? '跟随中' : '未跟随'}${isSel ? '（当前编辑工具，外圈标示）' : '，点击切换此工具'}">` +
      `<span class="tool-dot ${t.dot}"></span></span>`;
  }).join('');
  /* 成对模式：整颗胶囊的亮/暗 = 该条目对当前工具的跟随态 */
  let cls = '', tip = `${name}：点右侧圆点切换对应工具的跟随`;
  if (selTool) {
    const b = bindingOf(selDir, selTool);
    const on = b && !b.excluded.includes(name);
    cls = on ? 'on' : 'off';
    tip = `${name}：${on ? '跟随中，点击排除' : '未跟随，点击恢复'} ${T(selTool).name}（工具内文件保留）`;
  }
  return `<span class="c-item" data-t="${esc(name)}" title="${esc(tip)}">` +
    `<span class="c-name ${cls}">${esc(name)}</span><span class="dots">${dots}</span></span>`;
};
const restLine = (d, b) => {
  const rest = d.n - itemsOfDir(d).length;
  if (rest <= 0) return '';
  const follow = b ? d.n - b.excluded.length : 0;
  return `<div class="restline">…其余 ${rest} 条${b
    ? `：${follow > itemsOfDir(d).length - b.excluded.length ? '跟随中' : '已排除'}（演示数据仅列样例）`
    : '，连接后全量同步'}</div>`;
};

function renderPanel() {
  const p = document.getElementById('ipanel');
  const ttl = document.getElementById('ip-title');
  const stat = document.getElementById('ip-stat');
  const list = document.getElementById('ip-items');
  const foot = document.getElementById('ip-foot');
  const bAll = document.getElementById('ip-all'), bNone = document.getElementById('ip-none');
  if (!selDir && !selTool) { p.classList.remove('is-in'); p.classList.remove('is-pair'); return; }
  p.classList.add('is-in');
  /* 只有选中了工具（成对编辑）才显示圆环动效 */
  p.classList.toggle('is-pair', !!selTool);

  /* 成对编辑：目录 × 工具 */
  if (selDir && selTool) {
    const d = D(selDir), b = bindingOf(selDir, selTool), items = itemsOfDir(d);
    /* 通道级状态：两条通道都开且无排除 = 完整跟随；只开一条或有排除 = 部分跟随 */
    const tp = b ? typesOf(b) : null;
    const openCh = tp ? (tp.skills ? 1 : 0) + (tp.mcp ? 1 : 0) : 0;
    const st = !b ? 'off' : (openCh === 2 && !b.excluded.length ? 'full' : 'part');
    ttl.textContent = `${d.name} → ${T(selTool).name}`;
    bAll.style.display = bNone.style.display = '';
    bAll.onclick = () => {
      if (!b) return;
      b.excluded = []; b.types = { skills: true, mcp: true };
      toast('已恢复完整跟随（两条通道都打开）'); renderAll();
    };
    bNone.onclick = () => {
      if (!b) return;
      b.excluded = itemsOfDir(d).slice();
      removeBind(selDir, selTool);
      toast('全部条目已排除，连接已移除（工具内文件保留）'); renderAll();
    };
    if (!b) {
      stat.innerHTML = `<span class="pill off">未连接</span><span class="txt">连接后将立即把目录内 ${d.n} 个条目全量同步到工具，并持续跟随变化；工具内已有文件不受影响。</span>`;
      foot.innerHTML = `<button class="btn primary" id="ip-conn">连接（全量同步 + 持续跟随）</button>`;
      document.getElementById('ip-conn').onclick = () => {
        BINDS.push({ dir: selDir, tool: selTool, types: { skills: true, mcp: true }, excluded: [] });
        toast(`已连接：${d.name} → ${T(selTool).name}，全量同步 ${d.n} 条完成`); renderAll();
      };
      list.innerHTML = chipFlow(d, chip) + restLine(d, null);
    } else {
      const follow = d.n - b.excluded.length;
      const chTxt = tp && openCh < 2
        ? `仅 ${tp.skills ? 'Skills' : 'MCP'} 通道已连接（${tp.skills ? 'MCP' : 'Skills'} 通道未连接）`
        : `跟随 ${follow} / 共 ${d.n} 条`;
      stat.innerHTML = st === 'full'
        ? `<span class="pill ok">完整跟随</span><span class="txt">全部 ${d.n} 条跟随中 —— 目录内变化实时同步到工具。取消勾选条目即改为部分跟随（工具内保留已装文件）。</span>`
        : `<span class="pill part">部分跟随</span><span class="txt">${chTxt} —— 点连线可开关对应通道，取消勾选条目即排除；两条通道都关 = 断开。</span>`;
      foot.innerHTML = `${st === 'part' ? '<button class="btn" id="ip-fa">恢复全部跟随</button>' : ''}` +
        `<button class="btn danger" id="ip-disc">断开连接（保留工具内文件）</button>`;
      const fa = document.getElementById('ip-fa');
      if (fa) fa.onclick = () => { b.excluded = []; b.types = { skills: true, mcp: true }; toast('已恢复完整跟随（两条通道都打开）'); renderAll(); };
      document.getElementById('ip-disc').onclick = () => {
        removeBind(selDir, selTool);
        toast(`已断开：${d.name} ✕ ${T(selTool).name}；工具内已安装文件保留`); renderAll();
      };
      list.innerHTML = chipFlow(d, chip) + restLine(d, b);
    }
    return;
  }

  /* 仅选中目录：每条目一行，行内工具点 = 该条目对各工具的跟随开关 */
  if (selDir) {
    const d = D(selDir), items = itemsOfDir(d), bs = allBinds().filter(x => x.dir === selDir);
    ttl.textContent = d.name;
    bAll.style.display = bNone.style.display = 'none';
    stat.innerHTML = `<span class="pill ${bs.length ? 'ok' : 'off'}">${bs.length ? `已连接 ${bs.length} 个工具` : '未连接任何工具'}</span>` +
      `<span class="txt">行内圆点 = 该条目对每个工具的跟随开关；点击可单条连接/排除。点工具卡可成对编辑。</span>`;
    foot.innerHTML = '';
    list.innerHTML = chipFlow(d, chip) +
      `<div class="restline">…其余 ${d.n - items.length} 条同理（演示数据仅列样例）</div>`;
    return;
  }

  /* 仅选中工具：列出接入的来源，点击行回到成对编辑 */
  const t = T(selTool), bs = allBinds().filter(b => b.tool === selTool);
  ttl.textContent = t.name;
  bAll.style.display = bNone.style.display = 'none';
  stat.innerHTML = `<span class="pill ${bs.length ? 'ok' : 'off'}">${bs.length ? `接入 ${bs.length} 个来源 · ${bs.reduce((s, b) => s + (D(b.dir).n - b.excluded.length), 0)} 条` : '未接入任何目录 / 仓库'}</span>` +
    `<span class="txt">点击上方目录卡建立新连接；点击行回到成对编辑。</span>`;
  foot.innerHTML = '';
  list.innerHTML = bs.length ? bs.map(b => {
    const d = D(b.dir), st = stateOf(b);
    return `<div class="brow" data-go="${d.id}" style="cursor:pointer"><span class="tool-dot ${t.dot}"></span><span class="nm">${esc(d.name)}</span>` +
      `<span class="st ${st === 'full' ? 'ok' : 'part'}">${st === 'full' ? `完整跟随 ${d.n} 条` : `跟随 ${d.n - b.excluded.length}/${d.n}`}</span></div>`;
  }).join('') : `<div class="hint">尚无连接。先点一个目录卡，再保持本工具卡选中，即可在右侧连接。</div>`;
  list.querySelectorAll('[data-go]').forEach(r => r.onclick = () => { selDir = r.dataset.go; renderAll(); });
}

/* ==== 连线动效：draw-in（起点→终点揭示）/ draw-out（终点收缩回起点），遮罩揭示兼容虚线 ==== */
let maskSeq = 0;
function animateLine(g, dir) {
  const rp = g.querySelector('.reveal');
  if (!rp) return;
  const len = rp.getTotalLength();
  rp.style.transition = 'none';
  rp.style.strokeDasharray = `${len} ${len}`;
  rp.style.strokeDashoffset = dir === 'in' ? len : 0;
  rp.getBoundingClientRect();  /* 强制回流，确保过渡从设定值起跳 */
  rp.style.transition = `stroke-dashoffset ${dir === 'in' ? 420 : 220}ms cubic-bezier(.3,.6,.3,1)`;
  rp.style.strokeDashoffset = dir === 'in' ? 0 : len;
}

let animateGeom = false;  /* true = 本次绘制由用户操作触发，允许为几何变化播擦写动画 */
function drawLines() {
  const svg = document.getElementById('linksvg');
  const zone = document.getElementById('linkzone');
  if (!svg || !zone) return;
  const zr = zone.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${zr.width} ${zr.height}`);
  const pt = (el, edge) => {
    const r = el.getBoundingClientRect();
    return { x: r.left - zr.left + r.width / 2,
      y: (edge === 'top' ? r.top : r.bottom) - zr.top };
  };
  const segD = (a, b) => {
    const dy = (b.y - a.y) / 2;
    return `M ${a.x} ${a.y} C ${a.x} ${a.y + dy}, ${b.x} ${b.y - dy}, ${b.x} ${b.y}`;
  };
  const desired = [];
  /* 未选目录不画任何线；选中目录 = 该目录的从属线 + 该目录到各工具的链接态线 */
  if (selDir) {
    const dc = document.querySelector(`[data-dir="${selDir}"]`) ||
      document.querySelector(`[data-repo="${selDir}"]`);
    const skC = document.getElementById('type-skills'), mcC = document.getElementById('type-mcp');
    if (dc) {
      const from = pt(dc, 'bottom');  /* 单起点：两条从属线共用卡片底部中心 */
      [[skC, 'skills'], [mcC, 'mcp']].forEach(([c, ty]) => {
        if (!c) return;
        if (anyTypeOn() && !typeOn[ty]) return;  /* 聚焦类型时，未选中类型的从属线同样隐藏 */
        desired.push({ key: `w-${ty}`, d: segD(from, pt(c, 'top')),
          gCls: 'line-g noop', visCls: '', title: '' });  /* 与工具连线同款绿实线，仅点击无效果 */
      });
    }
    const dSel = D(selDir);
    [[skC, 'skills'], [mcC, 'mcp']].forEach(([card, ty]) => {
      if (!card) return;
      /* 聚焦过滤：选中类型/工具时，其他同类卡片的连线全部隐藏（卡片本体仅降对比度） */
      if (anyTypeOn() && !typeOn[ty]) return;
      const from = pt(card, 'bottom');
      const tyCount = ty === 'skills' ? dSel.s : dSel.m;
      /* 每条通道各自一条连接：点 Skills 只改 Skills 通道，点 MCP 只改 MCP 通道 */
      TOOLS.forEach(t => {
        const st = typeState(selDir, t.id, ty);
        if (selTool && selTool !== t.id) return;
        if (st === 'off' && selTool !== t.id) return;
        const tc = document.querySelector(`[data-tool="${t.id}"]`);
        if (!tc) return;
        const tyName = ty === 'skills' ? 'Skills' : 'MCP';
        /* 已删除的通道直接不画线：删除 = 取消这条连线（可用交汇处的链接按钮重新连） */
        if (PURGE.has(purgeKey(ty, t.id))) return;
        desired.push({
          key: `${ty}:${t.id}`, dataLine: `${ty}:${t.id}`, d: segD(from, pt(tc, 'top')),
          gCls: 'line-g',
          visCls: st === 'part' ? 'part' : st === 'blocked' ? 'blocked' : st === 'off' ? 'offln' : '',
          title: `${esc(D(selDir).name)} 的 ${tyName} ↔ ${T(t.id).name} · ${st === 'full' ? '已连接（点击断开）' : st === 'part' ? '部分跟随（点击断开）' : '未连接（点击连接；断开会保留工具内已装条目）'}`,
        });
      });
    });
  }
  /* 签名 = 线拓扑 + 画布尺寸；同签名走原位更新（不重播动效），变了才收缩→重画 */
  /* 快进未完成的过渡：移除旧层、新层立即定型（供动画中再次切换时调用，避免瞬变叠层） */
  const maskIdOf = el => {
    const ref = el && el.getAttribute('mask');
    return ref ? ref.replace(/^url\(#/, '').replace(/\)$/, '') : null;
  };
  function finishTransition(g) {
    /* 清掉无 vis 引用的死遮罩（含历史堆积） */
    g.querySelectorAll('mask').forEach(m => {
      const used = [...g.querySelectorAll('.vis')].some(v => v.getAttribute('mask') === `url(#${m.id})`);
      if (!used) m.remove();
    });
    const viss = [...g.querySelectorAll('.vis')];
    if (viss.length >= 2) {
      const oldVis = viss[0];
      const m = oldVis.getAttribute('mask') && document.getElementById(maskIdOf(oldVis));
      if (m) m.remove();
      oldVis.remove();
    }
    const keep = g.querySelector('.vis');
    const m2 = keep && document.getElementById(maskIdOf(keep));
    if (m2) { const r = m2.querySelector('.reveal'); r.style.transition = 'none'; r.style.strokeDashoffset = 0; }
    g._transiting = false;
  }
  /* 状态翻转动效：新状态从起点擦写进入，旧状态向起点收缩（双层遮罩，保留虚线纹理） */
  function transitionLine(g, o) {
    if (g._transiting) finishTransition(g);  /* 上一次过渡未完：快进定型，再起新擦写 */
    const oldVis = g.querySelector('.vis');
    const d = oldVis.getAttribute('d');
    g._transiting = true;
    /* 旧层收缩：直接定位旧层自己的遮罩 reveal（不能 querySelector，避免命中历史死遮罩） */
    const oldReveal = document.getElementById(maskIdOf(oldVis))?.querySelector('.reveal');
    if (oldReveal) {
      const olen = oldReveal.getTotalLength();
      oldReveal.style.transition = 'none';
      oldReveal.style.strokeDasharray = `${olen} ${olen}`;
      oldReveal.style.strokeDashoffset = 0;
      oldReveal.getBoundingClientRect();
      oldReveal.style.transition = 'stroke-dashoffset 220ms cubic-bezier(.3,.6,.3,1)';
      oldReveal.style.strokeDashoffset = olen;
    }
    const mid = 'lm' + (++maskSeq);
    const newD = o.d || d;  /* 几何可能已变（换卡片/面板开合）：新层走新路径 */
    const mask = document.createElementNS('http://www.w3.org/2000/svg', 'mask');
    mask.setAttribute('id', mid);
    mask.setAttribute('maskUnits', 'userSpaceOnUse');
    mask.setAttribute('x', '0'); mask.setAttribute('y', '0');
    mask.setAttribute('width', Math.max(1, Math.round(zr.width)));
    mask.setAttribute('height', Math.max(1, Math.round(zr.height)));
    mask.innerHTML = `<path class="reveal" d="${newD}" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>`;
    g.insertBefore(mask, oldVis);
    const newVis = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    newVis.setAttribute('class', 'vis ' + o.visCls);
    newVis.setAttribute('d', newD);
    newVis.setAttribute('mask', `url(#${mid})`);
    g.insertBefore(newVis, oldVis.nextSibling);
    const rp = mask.querySelector('.reveal');
    const len = rp.getTotalLength();
    rp.style.transition = 'none';
    rp.style.strokeDasharray = `${len} ${len}`;
    rp.style.strokeDashoffset = len;
    rp.getBoundingClientRect();
    rp.style.transition = 'stroke-dashoffset 400ms cubic-bezier(.3,.6,.3,1)';
    rp.style.strokeDashoffset = 0;  /* 新层：从起点发展向终点 */
    g.setAttribute('class', o.gCls);
    g.setAttribute('title', o.title);
    if (o.dataLine) g.setAttribute('data-line', o.dataLine);
    setTimeout(() => finishTransition(g), 430);  /* 定型：移除旧层，新 vis 成为唯一 .vis */
  }
  /* 增量对账：保留的线原地更新（不动画），只对新增/消失的线播进出动画。
     这样切换工具时上连线（key 未变）完全静止，只有真正变化的线动。 */
  {
    desired.forEach(o => {
      const g = svg.querySelector(`g[data-key="${o.key}"]`);
      if (!g) return;
      const vis = g.querySelector('.vis');
      const newVisCls = 'vis ' + o.visCls;
      const clsChanged = vis && vis.getAttribute('class') !== newVisCls;
      const dChanged = vis && vis.getAttribute('d') !== o.d;
      /* 状态翻转或（用户操作导致的）几何变化 → 同一套擦写过渡：
         旧线沿旧路径收缩，新线从新起点伸展，上下两层动画节奏一致 */
      if (vis && (clsChanged || (dChanged && animateGeom))) {
        transitionLine(g, o);
        return;
      }
      g.setAttribute('class', o.gCls);
      if (o.dataLine) g.setAttribute('data-line', o.dataLine);
      g.setAttribute('title', o.title);
      if (vis) vis.setAttribute('class', newVisCls);
      /* 几何同步：换了目录/卡片位移/面板开合时，路径必须跟着走，否则线停在旧位置 */
      const hit = g.querySelector('.hit');
      if (hit && hit.getAttribute('d') !== o.d) hit.setAttribute('d', o.d);
      g.querySelectorAll('.vis').forEach(v => {
        if (v.getAttribute('d') !== o.d) v.setAttribute('d', o.d);
        const m = document.getElementById(maskIdOf(v));
        const rp = m && m.querySelector('.reveal');
        if (rp && rp.getAttribute('d') !== o.d) rp.setAttribute('d', o.d);
      });
    });
  }
  /* 消失的线：收缩后移除 */
  const want = new Set(desired.map(o => o.key));
  svg.querySelectorAll('g[data-key]').forEach(g => {
    if (want.has(g.dataset.key)) return;
    if (g._leaving) return;
    g._leaving = true;
    animateLine(g, 'out');
    setTimeout(() => g.remove(), 240);
  });
  /* 新增的线：插入后从起点伸展 */
  const buildLine = o => {
    const mid = 'lm' + (++maskSeq);
    return `<g class="${o.gCls}" data-key="${o.key}"${o.dataLine ? ` data-line="${o.dataLine}"` : ''} title="${esc(o.title)}">` +
      `<mask id="${mid}" maskUnits="userSpaceOnUse" x="0" y="0" width="${Math.max(1, Math.round(zr.width))}" height="${Math.max(1, Math.round(zr.height))}">` +
      `<path class="reveal" d="${o.d}" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/></mask>` +
      `<path class="vis ${o.visCls}" d="${o.d}" mask="url(#${mid})"/>` +
      `<path class="hit" d="${o.d}"/></g>`;
  };
  desired.forEach(o => {
    if (svg.querySelector(`g[data-key="${o.key}"]`)) return;
    svg.insertAdjacentHTML('beforeend', buildLine(o));
    const g = svg.querySelector(`g[data-key="${o.key}"]`);
    if (g) animateLine(g, 'in');
  });
  renderDeleteBtns();
}

/* ==== 删除按钮：仅在选中工具、该通道为灰线（未连接）时，出现在连线与工具的交界处 ==== */
function renderDeleteBtns() {
  const zone = document.getElementById('linkzone');
  if (!zone) return;
  let layer = document.getElementById('dellayer');
  if (!layer) {
    layer = document.createElement('div');
    layer.id = 'dellayer'; layer.className = 'dellayer';
    zone.appendChild(layer);
  }
  layer.innerHTML = '';
  if (!selDir || !selTool) return;
  const zr = zone.getBoundingClientRect();
  /* 按钮放在「通道卡（Skills / MCP）与连线」的交汇处 = 通道卡底部，连线起点旁边 */
  [['skills', 'type-skills'], ['mcp', 'type-mcp']].forEach(([ty, cardId]) => {
    if (!typeOn[ty]) return;
    const purged = PURGE.has(purgeKey(ty, selTool));   /* 任何线态都显示按钮：已删除→↔，其余→× */
    const card = document.getElementById(cardId);
    if (!card) return;
    const cr = card.getBoundingClientRect();
    /* 放在「通道卡（Skills / MCP）与连线」的交汇处：通道卡底边中心，也就是连线的起点 */
    const at = { x: cr.left - zr.left + cr.width / 2, y: cr.bottom - zr.top };
    const btn = document.createElement('button');
    btn.dataset.del = ty;
    if (purged) {
      /* 已删除：按钮变成「链接」按钮，点击重新连上 */
      btn.className = 'del-btn link';
      btn.dataset.relink = ty;
      btn.title = `重新连接：把该目录的 ${ty === 'skills' ? 'Skills' : 'MCP'} 接到 ${T(selTool).name}`;
      btn.textContent = '↔';
    } else {
      btn.className = 'del-btn';
      btn.title = `删除：取消这条连线并清理该目录同步到 ${T(selTool).name} 的 ${ty === 'skills' ? 'Skills' : 'MCP'} 条目`;
      btn.textContent = '×';
    }
    btn.style.left = `${at.x - 14}px`;
    btn.style.top = `${at.y - 14}px`;
    layer.appendChild(btn);
  });
}

document.addEventListener('click', e => {
  const relink = e.target.closest('#dellayer .del-btn[data-relink]');
  if (relink) {
    e.stopImmediatePropagation();  /* 处理会重渲染按钮：连同一节点上的“点空白”判定一起拦住 */
    const ty = relink.dataset.relink;
    PURGE.delete(purgeKey(ty, selTool));
    const d0 = D(selDir);
    BINDS.push({ dir: selDir, tool: selTool, types: { skills: ty === 'skills', mcp: ty === 'mcp' }, excluded: [] });
    toast(`已重新连接：${d0.name} 的 ${ty === 'skills' ? 'Skills' : 'MCP'} ↔ ${T(selTool).name}`);
    renderAll();
    return;
  }
  const delBtn = e.target.closest('#dellayer .del-btn');
  if (delBtn) {
    e.stopImmediatePropagation();
    const ty = delBtn.dataset.del;
    /* 直接删除：取消该通道并清理已同步条目；按钮随之变成 ↔，可一键连回 */
    const bNow = bindingOf(selDir, selTool);
    if (bNow) {
      const tp = typesOf(bNow);
      tp[ty] = false;
      if (!tp.skills && !tp.mcp) removeBind(selDir, selTool);
    }
    PURGE.add(purgeKey(ty, selTool));
    toast(`已删除：连线已取消，该目录同步到 ${T(selTool).name} 的 ${ty === 'skills' ? 'Skills' : 'MCP'} 条目将被清理（点 ↔ 可重新连接）`);
    renderAll();
    return;
  }
}, true);
/* 点击连线 = 切换该类条目对当前选中目录×工具的跟随（全恢复 / 全排除） */
function toggleTypeFollow(dirId, toolId, ty) {
  const d = D(dirId), b = bindingOf(dirId, toolId);
  const items = ty === 'skills' ? (d.skills || []) : (d.mcp || []);
  if (!b || !items.length) return;
  if (items.every(n => b.excluded.includes(n))) {
    b.excluded = b.excluded.filter(n => !items.includes(n));
    toast(`${ty === 'skills' ? 'Skills' : 'MCP'} 条目已全部恢复跟随 ${T(toolId).name}`);
  } else {
    items.forEach(n => { if (!b.excluded.includes(n)) b.excluded.push(n); });
    if (b.excluded.length >= itemsOfDir(d).length) {
      removeBind(dirId, toolId);
      toast('全部条目已排除，连接已移除（工具内已安装文件保留）');
    } else {
      toast(`${ty === 'skills' ? 'Skills' : 'MCP'} 条目已全部停止跟随 ${T(toolId).name}（工具内保留）`);
    }
  }
  renderAll();
}

function renderAll() {
  renderSrc(); renderTypes(); renderTools(); renderPanel();
  animateGeom = true;   /* 用户操作：允许连线为几何变化播擦写动画 */
  drawLines();          /* 同步执行：getBoundingClientRect 自带强制布局，后台标签页也不丢帧 */
  animateGeom = false;
  updateApplyBtn();
}

/* 有未生效改动 → 右下角出现“确认更改” */
function updateApplyBtn() {
  let bar = document.getElementById('apply-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'apply-bar'; bar.className = 'apply-bar';
    bar.innerHTML = `<span class="tip">有 <b id="apply-count">0</b> 项未生效的连接更改</span>` +
      `<button class="apply-btn ghost" id="undo-btn">撤销</button>` +
      `<button class="apply-btn primary" id="apply-btn">确认更改</button>`;
    const zone = document.getElementById('linkzone');
    if (zone) zone.appendChild(bar);
  }
  /* 只在有选中（连线可见）时显示；点空白清空选中时一并隐藏 */
  const dirty = isDirty() && !!(selDir || selTool);
  bar.classList.toggle('is-on', dirty);
  if (dirty) {
    const snap = JSON.parse(COMMITTED);
    const cur = JSON.parse(stateSig());
    const setOf = o => new Set([...o.b, ...o.r].map(x => `${x.dir}:${x.tool}`));
    const a = setOf(snap), bb = setOf(cur);
    let n = 0;
    new Set([...a, ...bb]).forEach(k => { if (a.has(k) !== bb.has(k)) n++; });
    n += [...PURGE].filter(k => !snap.p.includes(k)).length;
    const el = document.getElementById('apply-count');
    if (el) el.textContent = String(Math.max(1, n));
  }
}
window.addEventListener('resize', () => drawLines());
/* 面板开合会改变主列宽度、行内滚动会移动卡片 —— 这些都不触发 resize，用 ResizeObserver 兜住 */
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => drawLines());
  const lz = document.getElementById('linkzone');
  if (lz) ro.observe(lz);
  const ip = document.getElementById('ipanel');
  if (ip) ro.observe(ip);
}
/* 行内横向滚动时卡片视口位置变化，实时重画连线锚点 */
document.querySelectorAll('.srcrow, .toolsrow').forEach(el =>
  el.addEventListener('scroll', () => drawLines(), { passive: true }));

/* ==== 事件（随时可编辑：点卡即选中/取消，无模式切换） ==== */
document.getElementById('dircards').onclick = e => {
  const c = e.target.closest('[data-dir]'); if (!c) return;

};
document.getElementById('repocards').onclick = e => {

};

document.getElementById('ip-x').onclick = () => { selDir = selTool = null; renderAll(); };
/* 点击空白处（卡片区/面板/顶栏/图例以外）= 取消所有选中。
   必须走捕获阶段：卡片/条目的处理器会 renderAll() 重渲染并把被点元素摘离 DOM，
   冒泡阶段再判断时 closest() 已经断开，会误判成“点了空白”。 */
document.addEventListener('click', e => {
  if (e.target.closest('.topbar, .metastrip, .group, [data-dir], [data-repo], [data-tool], .typecard, #linksvg, #dellayer, .ipanel, #toast')) return;
  selDir = selTool = null;
  typeOn.skills = typeOn.mcp = true;  /* 复位到默认态：两类型卡都选中 */
  renderAll();
}, true);
/* 条目区统一委托：点工具圆点 = 切换该条目对该工具的跟随；点胶囊其余部位 = 切换对当前选中工具的跟随 */
document.getElementById('ip-items').addEventListener('click', e => {
  if (!selDir) return;
  const d = D(selDir), items = itemsOfDir(d);
  const dot = e.target.closest('.tmini[data-tg]');
  const chipEl = e.target.closest('.c-item[data-t]');
  /* 条目所属类型 → 只打开对应通道（另一条通道保持原状，未连接就仍是未连接） */
  const typesFor = item => d.skills.includes(item)
    ? { skills: true, mcp: false } : { skills: false, mcp: true };
  /* 圆点优先：指定工具 */
  if (dot) {
    const t = dot.dataset.tg, item = dot.dataset.item;
    const b = bindingOf(selDir, t);
    if (!b) {
      BINDS.push({ dir: selDir, tool: t, types: typesFor(item), excluded: items.filter(n => n !== item) });
      toast(`「${item}」已连接到 ${T(t).name}（仅此条目跟随，其余已排除）`);
      renderAll();
    } else {
      toggleBindItem(b, item);  /* 全排除 = 断开，内部已处理 */
    }
    return;
  }
  /* 胶囊主体：成对模式下切成对工具；仅目录模式无选中工具时不动作 */
  if (chipEl && selTool) {
    const item = chipEl.dataset.t;
    const b = bindingOf(selDir, selTool);
    if (!b) {
      BINDS.push({ dir: selDir, tool: selTool, types: typesFor(item), excluded: items.filter(n => n !== item) });
      toast(`已连接「${item}」→ ${T(selTool).name}（仅此条目跟随，其余已排除）`);
      renderAll();
    } else {
      toggleBindItem(b, item);
    }
  }
});

/* 类型卡点击 = 选中/取消（选中后另一类型及其连线降对比） */
document.getElementById('type-skills').onclick = () => { typeOn.skills = !typeOn.skills; renderAll(); };
document.getElementById('type-mcp').onclick = () => { typeOn.mcp = !typeOn.mcp; renderAll(); };
/* 连线点击 = 切换该类条目的跟随；未选目录时先提示 */
document.getElementById('linksvg').addEventListener('click', e => {
  const g = e.target.closest('g.line-g');
  if (!g || g.classList.contains('noop')) return;  /* 目录→类型从属线点击无效果 */
  const [ty, toolId] = g.dataset.line.split(':');
  if (!selDir) { toast('先选中一个目录卡，再点击连线即可切换该类条目对工具的跟随'); return; }
  /* 红色线：再点一下取消删除标记，回到灰色（仅断开） */
  if (PURGE.has(purgeKey(ty, toolId))) {
    PURGE.delete(purgeKey(ty, toolId));
    toast('已取消删除标记，连线回到“仅断开”状态');
    renderAll();
    return;
  }
  /* 通道级连接开关：Skills 通道与 MCP 通道各自独立，互不影响 */
  const d0 = D(selDir);
  const tyName = ty === 'skills' ? 'Skills' : 'MCP';
  const items = ty === 'skills' ? (d0.skills || []) : (d0.mcp || []);
  let b0 = bindingOf(selDir, toolId);
  if (!b0) {
    b0 = { dir: selDir, tool: toolId, types: { skills: ty === 'skills', mcp: ty === 'mcp' }, excluded: [] };
    (selDir.slice(0, 2) === 'r-' ? REPO_BINDS : BINDS).push(b0);
    toast(`已连接：${d0.name} 的 ${tyName} ↔ ${T(toolId).name}`);
    renderAll();
    return;
  }
  const tp = typesOf(b0);
  const laneState = typeState(selDir, toolId, ty);
  /* 绿虚线（部分跟随）或已排除：点击 = 恢复完整跟随（变绿实线）；绿实线：点击 = 断开该通道 */
  if (laneState === 'full') {
    tp[ty] = false;
    if (!tp.skills && !tp.mcp) removeBind(selDir, toolId);
    toast(`已断开：${d0.name} 的 ${tyName} ✕ ${T(toolId).name}；工具内文件保留`);
  } else {
    tp[ty] = true;
    b0.excluded = b0.excluded.filter(n => !items.includes(n));
    if (laneState === 'off') toast(`已连接：${d0.name} 的 ${tyName} ↔ ${T(toolId).name}`);
    else toast(`已恢复完整跟随：${d0.name} 的 ${tyName} → ${T(toolId).name}`);
  }
  renderAll();
});
document.addEventListener('click', e => {
  if (e.target.closest('#undo-btn')) {           /* 撤销：回到上次生效的快照 */
    const snap = JSON.parse(COMMITTED);
    BINDS = snap.b;
    REPO_BINDS = snap.r;
    PURGE.clear();
    snap.p.forEach(k => PURGE.add(k));
    renderAll();
    toast('已撤销未生效的更改');
    return;
  }
  if (!e.target.closest('#apply-btn')) return;
  COMMITTED = stateSig();
  updateApplyBtn();
  toast('已生效：连接变更已保存');
});
COMMITTED = stateSig();  /* 初始快照 */
renderAll();
</script>
</body>
</html>
