<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Session Hub</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/hub-ui.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">

  <!-- ===== top bar ===== -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__name">Agent Session Hub</span>
      <span class="topbar__path">~/.agent/hub/</span>
    </div>
    <nav class="mod-nav" id="mod-nav" data-testid="mod-nav">
      <button data-view="sessions" data-testid="nav-sessions" class="is-on">会话</button>
      <button data-view="memory" data-testid="nav-memory">记忆</button>
      <button data-view="skills" data-testid="nav-skills">Skills</button>
      <button data-view="mcp" data-testid="nav-mcp">MCP</button>
      <button data-view="ops" data-testid="nav-ops">台账</button>
    </nav>
    <span class="topbar__spacer"></span>
    <span class="hub-badge" data-testid="engine-badge" id="engine-badge">检测引擎…</span>
    <button class="hub-btn" data-testid="stats-open" id="stats-open">统计</button>
    <button class="hub-btn" data-testid="schedule-open" id="schedule-open">定时任务</button>
    <button class="hub-btn hub-btn--primary" data-testid="refresh-all" id="refresh-all">⟳ 全部刷新</button>
  </header>

  <!-- ===== views ===== -->
  <div class="view is-active" id="view-sessions">
  <div class="main">

    <!-- left rail -->
    <aside class="rail">
      <div class="rail__h">已接入工具</div>
      <div id="tool-cards" data-testid="tool-cards"></div>
    </aside>

    <!-- center list -->
    <main class="center">
      <div class="center__toolbar">
        <div class="seg" id="filter-seg" data-testid="filter-seg">
          <button data-filter="all" data-testid="filter-all" class="is-on">全部</button>
          <button data-filter="claude" data-testid="filter-claude">Claude</button>
          <button data-filter="codex" data-testid="filter-codex">Codex</button>
          <button data-filter="opencode" data-testid="filter-opencode">OpenCode</button>
          <button data-filter="starred" data-testid="filter-starred">★ 收藏</button>
        </div>
        <input class="hub-input search" data-testid="search-input" id="search-input"
               placeholder="搜索标题 / 消息内容…">
      </div>
      <div class="list-head">
        <div><input type="checkbox" data-testid="sel-all" id="sel-all"
                    style="width:13px;height:13px;accent-color:var(--c-accent)"></div>
        <div>会话</div>
        <div style="text-align:right;padding-right:var(--sp-4)">消息</div>
        <div style="text-align:right">时间 · 来源</div>
      </div>
      <div class="rows" id="session-rows" data-testid="session-rows">
        <div class="hub-empty">加载中…</div>
      </div>
      <div class="search-panel" id="search-panel" data-testid="search-panel" style="display:none"></div>
    </main>

    <!-- right side -->
    <aside class="side">
      <div class="side__tabs" id="side-tabs" data-testid="side-tabs">
        <button data-tab="migrate" data-testid="tab-migrate" class="is-on">迁移</button>
        <button data-tab="memory" data-testid="tab-memory">记忆</button>
        <button data-tab="ledger" data-testid="tab-ledger">台账</button>
      </div>
      <div class="side__body">

        <!-- migrate panel -->
        <div class="side-panel" data-panel="migrate">
          <div class="side__h">迁移目标 · 拖入或点选</div>
          <div id="drops" data-testid="drops"></div>
          <div class="migrate-box">
            <div class="migrate-box__count">已选 <b data-testid="sel-count" id="sel-count">0</b> 条会话</div>
            <div class="side__h" style="margin-top:var(--sp-2)">最近迁移 · lineage</div>
            <div id="mig-list" data-testid="mig-list"></div>
          </div>
        </div>

        <!-- memory panel -->
        <div class="side-panel" data-panel="memory" style="display:none">
          <div class="side__h">新增记忆</div>
          <div class="mem-form">
            <input class="hub-input" data-testid="memory-title" id="memory-title" placeholder="标题（可选）">
            <textarea class="hub-input" data-testid="memory-body" id="memory-body"
                      placeholder="内容：偏好、决策、约定…" rows="3"></textarea>
            <button class="hub-btn hub-btn--primary" data-testid="memory-add" id="memory-add">保存记忆</button>
          </div>
          <div class="side__h">记忆列表</div>
          <div id="memory-list" data-testid="memory-list"></div>
        </div>

        <!-- ledger panel -->
        <div class="side-panel" data-panel="ledger" style="display:none">
          <div class="side__h">最近操作</div>
          <div id="ledger-list" data-testid="ledger-list"></div>
        </div>

      </div>
    </aside>
  </div>
  </div><!-- /view-sessions -->
  <div class="view" id="view-memory"></div>
  <div class="view" id="view-skills"></div>
  <div class="view" id="view-mcp"></div>
  <div class="view" id="view-ops"></div>

  <!-- ===== status bar ===== -->
  <footer class="statusbar">
    <span><span class="dot-ok"></span><span data-testid="status-db" id="status-db">hub.db · ~/.agent/hub/</span></span>
    <span data-testid="status-sched" id="status-sched">定时调度：—</span>
    <span data-testid="status-mem" id="status-mem">记忆 —</span>
    <span data-testid="status-am" id="status-am">记忆总线 —</span>
    <span class="spacer"></span>
    <span>仅本地 · 无云端上传</span>
  </footer>
</div>

<!-- ===== preview overlay ===== -->
<div class="preview-overlay" id="preview-overlay" data-testid="preview-overlay">
  <div class="preview">
    <div class="preview__head">
      <span class="preview__title" data-testid="preview-title" id="preview-title">会话预览</span>
      <button class="hub-btn btn-sm" data-testid="preview-close" id="preview-close">关闭</button>
    </div>
    <div class="preview__chain" data-testid="preview-chain" id="preview-chain"></div>
    <div class="preview__acts">
      <button class="hub-btn btn-sm" data-testid="preview-star" id="preview-star">☆ 收藏</button>
      <button class="hub-btn btn-sm" data-testid="preview-resume" id="preview-resume">复制 resume 命令</button>
      <button class="hub-btn btn-sm" data-testid="preview-export" id="preview-export">导出 Markdown</button>
    </div>
    <div class="preview__body" data-testid="preview-body" id="preview-body"></div>
  </div>
</div>

<!-- ===== schedule overlay ===== -->
<div class="sched-overlay" id="sched-overlay" data-testid="sched-overlay">
  <div class="sched">
    <div class="sched__head">
      <span class="sched__title">定时刷新任务</span>
      <button class="hub-btn btn-sm" data-testid="sched-close" id="sched-close">关闭</button>
    </div>
    <div class="sched__body">
      <div class="sched__hint">按范围启用并选择间隔；应用内调度器在服务运行时生效。</div>
      <div id="sched-body" data-testid="sched-body"></div>
    </div>
    <div class="sched__foot">
      <button class="hub-btn" id="sched-cancel" onclick="closeSchedule()">取消</button>
      <button class="hub-btn hub-btn--primary" data-testid="sched-save" id="sched-save">保存</button>
    </div>
  </div>
</div>

<script src="/assets/hub-ui.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/views/skills.js"></script>
<script src="/assets/views/mcp.js"></script>
<script src="/assets/views/ops.js"></script>
</body>
</html>
